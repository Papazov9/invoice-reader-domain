# Invoice reader — deterministic-first Python microservice (pdftotext + Tesseract OCR).
#
# Digital PDFs are read exactly and for free by the deterministic pipeline (no model).
# The vision fallback fires ONLY when a read comes out incomplete/unreconciled (typically a
# phone photo) and is routed to Claude Haiku 4.5 — a few cents per hard photo, and nothing
# for a clean digital PDF. No local model, so no GPU/large-RAM requirement and no swap.
#
# Deploy (the host/bot must provide INGEST_SERVICE_TOKEN and ANTHROPIC_API_KEY):
#   docker compose up -d --build
# with both values present in the environment / project .env (NEVER committed).
#
# The bot maps the public domain (https://invoice-bot.unparalleled.bg) → the `reader`
# service on port 8000.

services:
  reader:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OCR_VISION_FALLBACK: "true"
      # Vision fallback → Claude Haiku 4.5 via litellm. Runs only for hard photos the
      # deterministic pass can't reconcile; digital PDFs never reach it.
      OCR_VISION_MODEL: "anthropic/claude-haiku-4-5-20251001"
      # No OCR_VISION_API_BASE: an empty base makes litellm use LLM_API_KEY against the
      # Anthropic API. Setting a base here would suppress the api-key header.
      LLM_ASSIST_ENABLED: "false"                  # the vision call already reads every field
      COMPANY_LOOKUP_ENABLED: "false"              # no external register scrape
      LLM_TIMEOUT: "60"                            # Claude answers in seconds
      # REQUIRED. Anthropic key for the Claude Haiku 4.5 safety net.
      LLM_API_KEY: "${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in the environment}"
      # REQUIRED. Must equal the INGEST_SERVICE_TOKEN Supabase secret in gumialex.
      INGEST_SERVICE_TOKEN: "${INGEST_SERVICE_TOKEN:?set INGEST_SERVICE_TOKEN in the environment}"
    ports:
      - "8000:8000"                    # the bot routes invoice-bot.unparalleled.bg → here
    restart: unless-stopped
