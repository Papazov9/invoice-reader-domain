# Invoice reader — deterministic-first Python microservice (pdftotext + Tesseract OCR).
#
# Digital PDFs are read exactly and for free by the deterministic pipeline (no model).
# The vision fallback fires ONLY when a read comes out incomplete/unreconciled (typically a
# phone photo) and is routed to Claude Haiku 4.5 — a few cents per hard photo, and nothing
# for a clean digital PDF. No local model, so no GPU/large-RAM requirement and no swap.
#
# Deploy (the host/bot must provide INGEST_SERVICE_TOKEN):
#   docker compose up -d --build
# with that value present in the environment / project .env (NEVER committed).
#
# The Anthropic key is NOT stored here: the gumialex edge function holds each tenant's own
# key (in Supabase) and forwards it per request as the `x-llm-api-key` header, so the reader
# host keeps no key and each tenant's vision usage bills to that tenant. ANTHROPIC_API_KEY is
# an OPTIONAL env fallback for standalone use — leave it unset in the multi-tenant setup.
#
# The bot maps the public domain (https://invoice-bot.unparalleled.bg) → the `reader`
# service on port 8000.

services:
  reader:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      OCR_VISION_FALLBACK: "true"
      # Both Claude-backed paths use Haiku 4.5 via litellm, and BOTH stay enabled (each is a
      # non-destructive gap-filler — it only fills fields the deterministic pass left weak,
      # never overrides a confident read):
      #   - llm_assist (text): fills weak NON-AMOUNT fields (parties/number/date).
      #   - vision (image):    reads item rows + fields the rules missed on hard photos.
      # Both fire only on the gates in the code (weak/incomplete reads); a clean digital PDF
      # triggers neither, so it costs nothing.
      LLM_MODEL: "anthropic/claude-haiku-4-5-20251001"
      OCR_VISION_MODEL: "anthropic/claude-haiku-4-5-20251001"
      # No OCR_VISION_API_BASE / LLM_API_BASE: an empty base makes litellm use the request's
      # x-llm-api-key (or LLM_API_KEY) against the Anthropic API. A base would suppress it.
      COMPANY_LOOKUP_ENABLED: "false"              # no external register scrape
      LLM_TIMEOUT: "60"                            # Claude answers in seconds
      # OPTIONAL fallback only. Normally unset — the edge function forwards the key per request
      # (x-llm-api-key). Set it only for standalone use without the gumialex proxy.
      LLM_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # REQUIRED. Must equal the INGEST_SERVICE_TOKEN Supabase secret in gumialex.
      INGEST_SERVICE_TOKEN: "${INGEST_SERVICE_TOKEN:?set INGEST_SERVICE_TOKEN in the environment}"
    ports:
      - "8000:8000"                    # the bot routes invoice-bot.unparalleled.bg → here
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Primex product-feed FTP front door (SFTPGo) + bridge to Supabase.
  # Separate concern from the reader; shares only the box. Primex uploads a CSV
  # over plain FTP into the `primex` user's chrooted home; feed-bridge ferries
  # it to the `feed-quarantine` bucket and triggers primex-feed-import.
  # ---------------------------------------------------------------------------
  sftpgo:
    image: drakkan/sftpgo:v2.6-alpine
    restart: unless-stopped
    ports:
      - "21:2121"                      # FTP control (host 21 -> container 2121, non-root)
      - "50000-50100:50000-50100"      # FTP passive data range (must match sftpgo.json)
      - "127.0.0.1:8080:8080"          # admin UI, localhost only (reach via SSH tunnel)
    environment:
      # Public IP SFTPGo advertises for passive connections. Not a secret, but
      # kept in .env so this file has no host-specific values.
      SFTPGO_FTPD__BINDINGS__0__FORCE_PASSIVE_IP: "${VPS_PUBLIC_IP:?set VPS_PUBLIC_IP in .env}"
      SFTPGO_LOADDATA_FROM: /var/lib/sftpgo/init/users.json
      SFTPGO_LOADDATA_MODE: "0"        # load/update users on every start
    volumes:
      - ./sftpgo/sftpgo.json:/etc/sftpgo/sftpgo.json:ro
      - ./sftpgo/users.json:/var/lib/sftpgo/init/users.json:ro
      - sftpgo_data:/srv/sftpgo/data
      - sftpgo_db:/var/lib/sftpgo

  feed-bridge:
    build:
      context: ./sftpgo/bridge
    restart: unless-stopped
    environment:
      SUPABASE_URL: "${SUPABASE_URL:?set SUPABASE_URL in .env}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:?set SUPABASE_SERVICE_ROLE_KEY in .env}"
      PRIMEX_IMPORT_SECRET: "${PRIMEX_IMPORT_SECRET:?set PRIMEX_IMPORT_SECRET in .env}"
      WATCH_DIR: "/data/primex"
      BUCKET: "feed-quarantine"
      IMPORT_FUNCTION: "primex-feed-import"
      POLL_SECONDS: "30"
      STABLE_SECONDS: "20"
    volumes:
      - sftpgo_data:/data           # same volume SFTPGo writes uploads into
    depends_on:
      - sftpgo

volumes:
  sftpgo_data:
  sftpgo_db:
